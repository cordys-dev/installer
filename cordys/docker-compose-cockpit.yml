services:
  cordys_cockpit:
    image: ${CORDYS_IMAGE_PREFIX}/${CORDYS_IMAGE_NAME}:${CORDYS_IMAGE_TAG}
    container_name: cordys-crm-cockpit

    entrypoint: [ "/shells/start-cockpit.sh" ]
    depends_on:
      cordys:
        condition: service_healthy
    environment:
      REDIS_HOST: ${CORDYS_REDIS_HOST}
      REDIS_PORT: ${CORDYS_REDIS_PORT}
      REDIS_PASSWORD: ${CORDYS_REDIS_PASSWORD}
      SESSION_TTL_SECONDS: ${CORDYS_COCKPIT_SESSION_TTL_SECONDS:-2592000}
      CORDYS_CRM_URL: "http://${CORDYS_SERVER_HOST:-cordys-crm}:${CORDYS_SERVER_PORT:-8081}"
      CORDYS_MCP_URL: "http://${CORDYS_SERVER_HOST:-cordys-crm-mcp-server}:${CORDYS_MCP_SERVER_PORT:-8082}/mcp"
      RUN_TIMEOUT_MS: ${CORDYS_COCKPIT_RUN_TIMEOUT_MS:-360000}
      AGENT_THINKING_LEVEL: ${CORDYS_COCKPIT_THINKING_LEVEL:-medium}

    ports:
      - ${CORDYS_COCKPIT_SERVER_PORT}:8088
    healthcheck:
      test: [ "CMD", "bash", "-c", "< /dev/tcp/localhost/8088" ]
      interval: 6s
      timeout: 10s
      retries: 50
    restart: always
    networks:
      - cordys-network
