services:
  cordys_cockpit:
    image: ${CORDYS_IMAGE_PREFIX}/${CORDYS_IMAGE_NAME}:${CORDYS_IMAGE_TAG}
    container_name: cordys-crm-cockpit

    entrypoint: [ "/shells/start-cockpit.sh" ]
    depends_on:
      cordys:
        condition: service_healthy
    environment:
      REDIS_HOST: ${CORDYS_REDIS_HOST}
      REDIS_PORT: ${CORDYS_REDIS_PORT}
      REDIS_PASSWORD: ${CORDYS_REDIS_PASSWORD}
      SESSION_TTL_SECONDS: ${CORDYS_COCKPIT_SESSION_TTL_SECONDS}
      CORDYS_CRM_URL: ${CORDYS_CRM_URL}
      CORDYS_MCP_URL: ${CORDYS_MCP_URL}
      RUN_TIMEOUT_MS: ${CORDYS_COCKPIT_RUN_TIMEOUT_MS}
      OPENAI_COMPATIBLE_BASE_URL: ${CORDYS_COCKPIT_OPENAI_COMPATIBLE_BASE_URL}
      OPENAI_COMPATIBLE_MODEL: ${CORDYS_COCKPIT_OPENAI_COMPATIBLE_MODEL}
      OPENAI_COMPATIBLE_CONTEXT_WINDOW: ${CORDYS_COCKPIT_OPENAI_COMPATIBLE_CONTEXT_WINDOW}
      OPENAI_COMPATIBLE_API_KEY: ${CORDYS_COCKPIT_OPENAI_COMPATIBLE_API_KEY}
      AGENT_THINKING_LEVEL: ${CORDYS_COCKPIT_THINKING_LEVEL}

    ports:
      - ${CORDYS_COCKPIT_SERVER_PORT}:8088
    healthcheck:
      test: [ "CMD", "bash", "-c", "< /dev/tcp/localhost/8088" ]
      interval: 6s
      timeout: 10s
      retries: 50
    restart: always
    networks:
      - cordys-network
