# 基础配置
## 安装路径, Cordys CRM 配置及数据文件默认将安装在 ${CORDYS_BASE}/cordys 目录下
CORDYS_BASE=/opt
## Cordys CRM 使用的 docker 网络网段信息
CORDYS_DOCKER_SUBNET=172.30.10.0/24
## 镜像前缀
CORDYS_IMAGE_PREFIX='registry.fit2cloud.com/cordys'
## 镜像相关
CORDYS_IMAGE_NAME=cordys-crm-ce
CORDYS_IMAGE_TAG=dev

## CORDYS 主程序的 HTTP 服务监听端口
CORDYS_SERVER_HOST=cordys-crm
CORDYS_SERVER_PORT=8081

# 数据库配置
## 是否使用外部数据库
CORDYS_EXTERNAL_MYSQL=false
## 数据库地址
CORDYS_MYSQL_HOST=mysql
## 数据库端口
CORDYS_MYSQL_PORT=3306
## 数据库库名
CORDYS_MYSQL_DB=cordys-crm
## 数据库用户名
CORDYS_MYSQL_USER=root
## 数据库密码
CORDYS_MYSQL_PASSWORD=CordysCRM@mysql

# Redis 配置
## 是否使用外部Redis
CORDYS_EXTERNAL_REDIS=false
## Redis 端口
CORDYS_REDIS_PORT=6379
## Redis 密码
CORDYS_REDIS_PASSWORD=CordysCRM@redis
## Redis地址
CORDYS_REDIS_HOST=redis

#MCP Server
CORDYS_MCP_EXTERNAL_SERVER=false
CORDYS_MCP_SERVER_PORT=8082

# ==================== Cockpit 智能体平台部署配置 ====================
# ---- Cockpit → CRM 数据面 ----
## Cockpit 直连 CRM 数据面的地址；留空则自动使用 http://${CORDYS_SERVER_HOST}:${CORDYS_SERVER_PORT}
CORDYS_CRM_URL=http://cordys-crm:8081

# ---- Cockpit → MCP Server ----
## Cockpit 连接的内置 Cordys CRM MCP Server 的 Streamable HTTP 端点。
## 默认指向 docker 网络内的 mcp 服务（服务名 cordys_mcp，内部端口 8082）；
## 若使用外部 MCP Server 请改为对应地址。
CORDYS_MCP_URL=http://cordys-crm-mcp-server:8082/mcp
## 是否启用 MCP 工具调用（映射 commons.properties 的 ${AGENT_MCP_ENABLED}）
CORDYS_COCKPIT_MCP_ENABLED=true

# Cockpit Server
CORDYS_COCKPIT_EXTERNAL_SERVER=false
CORDYS_COCKPIT_SERVER_PORT=8088